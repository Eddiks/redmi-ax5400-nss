
name: Build Redmi AX5400 NSS Firmware

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch or tag"
        required: true
        default: "v2026.10.23-ath11k"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build RA74 Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Show build environment
        run: |
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 \
            python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl zstd

      - name: Configure environment
        run: |
          echo "PYTHONUTF8=1" >> "$GITHUB_ENV"
          echo "PYTHONIOENCODING=utf-8" >> "$GITHUB_ENV"
          echo "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> "$GITHUB_PATH"

      - name: Update feeds
        run: |
          cp ra74/feeds.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds uninstall \
            librespeed-cli librespeed-cli-rust \
            luci-app-librespeed

      - name: Configure firmware
        run: |
          cp ra74/build.config .config
          make defconfig

      - name: Run project checks
        run: |
          python3 ra74/tests/check_dma.py .
          python3 ra74/tests/check_switch.py . --dual-link
          python3 ra74/tests/check_defaults.py .

      - name: Download sources
        run: |
          make -j2 download

      - name: Compile firmware
        run: |
          make -j2 V=s

      - name: Prepare build information
        if: success()
        run: |
          TARGET=bin/targets/qualcommax/ipq50xx
          mkdir -p build-info
          cp .config build-info/
          cp "$TARGET/sha256sums" build-info/ 2>/dev/null || true
          cp "$TARGET/manifest" build-info/ 2>/dev/null || true
          df -h

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX5400-RA74-Firmware
          path: |
            bin/targets/qualcommax/ipq50xx/
            build-info/
          if-no-files-found: error
          retention-days: 14
