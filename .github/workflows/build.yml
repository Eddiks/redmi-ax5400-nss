
name: Build Redmi AX5400 NSS Firmware

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch or tag"
        required: true
        default: "v2026.10.23-ath11k"
        type: string

      wifi_nss_offload:
        description: "Enable Wi-Fi NSS Offload"
        required: true
        default: "on"
        type: choice
        options:
          - "on"
          - "off"

permissions:
  contents: read

jobs:
  build:
    name: Build RA74 Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Yongzhaooo/redmi-ax5400-nss
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Show build environment
        run: |
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 \
            python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl zstd

      - name: Configure environment
        run: |
          echo "PYTHONUTF8=1" >> "$GITHUB_ENV"
          echo "PYTHONIOENCODING=utf-8" >> "$GITHUB_ENV"
          echo "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> "$GITHUB_PATH"

      - name: Update feeds
        run: |
          cp ra74/feeds.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds uninstall \
            librespeed-cli librespeed-cli-rust \
            luci-app-librespeed

      - name: Configure firmware
        run: |
          cp ra74/build.config .config
          make defconfig

      - name: Configure Wi-Fi NSS Offload # Added code to trigger wifi NSS Offload in compilation
        env:
          WIFI_NSS_OFFLOAD: ${{ inputs.wifi_nss_offload }}
        run: |
          set -euo pipefail

          D=package/nss/nss-tools/files/nss-dwmac.defaults

          if [ "$WIFI_NSS_OFFLOAD" = "on" ]; then
            echo "Enabling Wi-Fi NSS Offload by default..."

            # 1. Enable Wi-Fi NSS offload for Redmi AX5400
            sed -i "/xiaomi,redmi-ax5400)/,/;;/ s/wifi_offload='0'/wifi_offload='1'/" "$D"

            # 2. Remove first-migration logic that forces offload to 0
            sed -i "/redmi-ax5400' ] || uci set nss.general.wifi_offload='0'/d" "$D"

            # 3. Update expected defaults in the test
            sed -i "s/'nss.general.wifi_offload': '0', 'nss.general.topology'/'nss.general.wifi_offload': '1', 'nss.general.topology'/" ra74/tests/check_defaults.py

            # Verify modifications
            grep -Fq "wifi_offload='1'" "$D"
            ! grep -Fq "redmi-ax5400' ] || uci set nss.general.wifi_offload='0'" "$D"
            grep -Fq "'nss.general.wifi_offload': '1'" ra74/tests/check_defaults.py

          elif [ "$WIFI_NSS_OFFLOAD" = "off" ]; then
            echo "Keeping original Wi-Fi NSS Offload defaults..."

            # Verify original defaults remain unchanged
            grep -Fq "wifi_offload='0'" "$D"
            grep -Fq "redmi-ax5400' ] || uci set nss.general.wifi_offload='0'" "$D"
            grep -Fq "'nss.general.wifi_offload': '0'" ra74/tests/check_defaults.py

          else
            echo "Invalid Wi-Fi NSS Offload option"
            exit 1
          fi

          echo "Wi-Fi NSS Offload setting: $WIFI_NSS_OFFLOAD"

          git diff --stat

      - name: Run project checks
        run: |
          python3 ra74/tests/check_dma.py .
          python3 ra74/tests/check_switch.py . --dual-link
          python3 ra74/tests/check_defaults.py .

      - name: Download sources
        run: |
          make -j2 download

      - name: Compile firmware
        run: |
          make -j2 V=s
          
      - name: Verify firmware target
        run: |
          TARGET=bin/targets/qualcommax/ipq50xx

          test -d "$TARGET"

          find "$TARGET" -maxdepth 1 -type f \
            -name '*xiaomi_redmi-ax5400*' \
            | grep .
            
      - name: Prepare build information
        if: success()
        run: |
          TARGET=bin/targets/qualcommax/ipq50xx
          mkdir -p build-info
          cp .config build-info/
          cp "$TARGET/sha256sums" build-info/ 2>/dev/null || true
          cp "$TARGET/manifest" build-info/ 2>/dev/null || true
          df -h

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX5400-RA74-Firmware
          path: |
            bin/targets/qualcommax/ipq50xx/
            build-info/
          if-no-files-found: error
          retention-days: 14
